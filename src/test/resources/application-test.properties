spring.application.name=VeyraPlatform

spring.datasource.url=jdbc:h2:mem:veyra_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.h2.console.enabled=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

authorization.jwt.secret=test-secret-key-for-integration-tests-123456789
authorization.jwt.expiration.days=7

stripe.api.key=sk_test_dummy_key_for_integration_tests
stripe.webhook.secret=whsec_test_dummy_secret

documentation.application.description=Backend API for Veyra Platform
documentation.application.version=1.0.0
