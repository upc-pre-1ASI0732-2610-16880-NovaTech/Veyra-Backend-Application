spring.datasource.url=jdbc:h2:mem:veyra_test_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=never
spring.jpa.show-sql=false

# Application metadata for OpenAPI
spring.application.name=VeyraPlatform
documentation.application.description=Test application context
documentation.application.version=0.0.1-test

# Cloudinary test configuration
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# JWT test configuration
authorization.jwt.secret=12345678901234567890123456789012
authorization.jwt.expiration.days=7

# Stripe test configuration
stripe.api.key=test-api-key
stripe.webhook.secret=test-webhook-secret
