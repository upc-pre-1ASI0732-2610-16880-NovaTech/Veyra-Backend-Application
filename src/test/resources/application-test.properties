spring.application.name=VeyraPlatform

spring.datasource.url=jdbc:mysql://localhost:3306/veyra_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${TEST_DATABASE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

authorization.jwt.secret=test-secret-key-for-integration-tests-123456789
authorization.jwt.expiration.days=7

stripe.api.key=sk_test_dummy_key_for_integration_tests
stripe.webhook.secret=whsec_test_dummy_secret

documentation.application.description=Backend API for Veyra Platform
documentation.application.version=1.0.0

spring.data.mongodb.uri=mongodb://localhost:27017/veyra_test
