# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - veyra-backend-app

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: veyraacr.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_59DFF8D44FA2474E8A0C3B0DC14486D6 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_18E9B42C1AF045609ECD0DD321C37C3A }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: veyraacr.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_59DFF8D44FA2474E8A0C3B0DC14486D6 }}/veyra-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40C0805785CC466AA73E972777265762 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E119F159B21484781E09BF6F887FC05 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14A45AAB2F264C9993B12F032863BEBD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'veyra-backend-app'
          slot-name: 'Production'
          images: 'veyraacr.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_59DFF8D44FA2474E8A0C3B0DC14486D6 }}/veyra-backend:${{ github.sha }}'
          